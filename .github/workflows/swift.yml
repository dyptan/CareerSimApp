# This workflow builds the CareersApp Xcode project.
# CareersApp is an Xcode app project, not a SwiftPM package, so it uses
# xcodebuild rather than `swift build`.
#
# Code signing is disabled because GitHub-hosted runners don't carry an
# Apple developer certificate; signing the .app at the end of the build
# would otherwise fail with exit code 65.
#
# The CareersAppTests target holds the unit tests (career-graph invariants
# and the venture-launch lifecycle). It deploys to macOS 13.0, which matches
# the runner, so the test step below runs it after the build.
#
# xcodebuild output is teed to a log file and piped through xcbeautify
# (github-actions renderer). On failure the tail of the log is emitted
# as a ::error:: block so the real xcodebuild error surfaces on the run
# summary even when the per-step logs aren't easily reachable.
#
# This is the check that guards pull requests, and it is deliberately the
# only one: it signs nothing and never talks to App Store Connect. The
# Xcode Cloud workflow archives and uploads, so it runs on tags instead of
# on every push — App Store Connect caps uploads per app per day (error
# 90382, "Upload limit reached"), and archiving on each push exhausted that
# cap in a single afternoon, after which every build failed at "Preparing
# build for App Store Connect" with a clean compile behind it. Validation
# belongs here; releases go through Xcode Cloud on a tag.
#
# A tag also builds here, and keeps the Release app as a downloadable
# artifact. It is unsigned — a GitHub runner carries no Apple certificate —
# so it is a build to inspect or run locally, not one to hand to anybody.
# The signed, notarised build is Xcode Cloud's job.

name: Swift

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Show Xcode version
      run: xcodebuild -version

    - name: Install xcbeautify
      run: brew install xcbeautify

    - name: Build
      id: build
      run: |
        set -o pipefail
        xcodebuild \
          -project CareersApp.xcodeproj \
          -scheme CareersApp \
          -destination 'generic/platform=macOS' \
          -configuration Debug \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          build \
          2>&1 | tee build.log | xcbeautify --renderer github-actions

    - name: Surface build log tail on failure
      if: failure() && steps.build.conclusion == 'failure'
      run: |
        echo "::group::xcodebuild tail (build.log)"
        tail -n 120 build.log || true
        echo "::endgroup::"
        echo "::error title=xcodebuild build failed::$(grep -E '^(error:|.*: error:)' build.log | tail -n 5 | tr '\n' ' ' || echo 'see log tail above')"

    - name: Test
      id: test
      run: |
        set -o pipefail
        xcodebuild \
          -project CareersApp.xcodeproj \
          -scheme CareersApp \
          -destination 'platform=macOS' \
          -configuration Debug \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          test \
          2>&1 | tee test.log | xcbeautify --renderer github-actions

    - name: Surface test log tail on failure
      if: failure() && steps.test.conclusion == 'failure'
      run: |
        echo "::group::xcodebuild tail (test.log)"
        tail -n 200 test.log || true
        echo "::endgroup::"
        echo "::error title=xcodebuild test failed::$(grep -E 'error:|failed|Assertion|Fatal error|crash' test.log | tail -n 8 | tr '\n' ' ' || echo 'see log tail above')"

    - name: Upload logs on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: xcodebuild-logs
        path: |
          build.log
          test.log
          release-build.log
        if-no-files-found: ignore

    # Everything below runs only for a tag. The job above has already built and
    # tested Debug; this rebuilds at Release so the artifact is the optimized
    # app rather than a debug one.
    - name: Build the release app
      if: startsWith(github.ref, 'refs/tags/')
      id: release_build
      run: |
        set -o pipefail
        xcodebuild \
          -project CareersApp.xcodeproj \
          -scheme CareersApp \
          -destination 'generic/platform=macOS' \
          -configuration Release \
          -derivedDataPath release-build \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          build \
          2>&1 | tee release-build.log | xcbeautify --renderer github-actions

    - name: Surface release build log tail on failure
      if: failure() && steps.release_build.conclusion == 'failure'
      run: |
        echo "::group::xcodebuild tail (release-build.log)"
        tail -n 120 release-build.log || true
        echo "::endgroup::"
        echo "::error title=release build failed::$(grep -E '^(error:|.*: error:)' release-build.log | tail -n 5 | tr '\n' ' ' || echo 'see log tail above')"

    - name: Package the app
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        set -euo pipefail
        APP="release-build/Build/Products/Release/CareersApp.app"
        test -d "$APP"
        # ditto, not zip: a .app is a bundle of symlinks and exec permissions,
        # and uploading the directory directly would flatten them into something
        # that no longer launches.
        ditto -c -k --keepParent "$APP" "CareersApp-${GITHUB_REF_NAME}-macOS.zip"
        ls -lh "CareersApp-${GITHUB_REF_NAME}-macOS.zip"

    - name: Upload the app
      if: startsWith(github.ref, 'refs/tags/')
      uses: actions/upload-artifact@v4
      with:
        name: CareersApp-${{ github.ref_name }}-macOS
        path: CareersApp-*-macOS.zip
        if-no-files-found: error
